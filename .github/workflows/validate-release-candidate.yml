name: Validate SLT Free v1.8.1 release candidate

on:
  workflow_dispatch:
  push:
    branches:
      - release-candidate/slt-free-v181

permissions:
  contents: read

jobs:
  validate:
    name: Full validation on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Build-only placeholders. They are deliberately non-production values and
      # the workflow never starts the application or connects to Supabase.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-validation.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-validation-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install isolated PostgreSQL 17 runtime
        run: |
          npm install \
            --prefix node_modules/.modality-verification \
            --no-save \
            --package-lock=false \
            embedded-postgres@17.10.0-beta.17

      - name: Run complete test suite
        run: |
          node node_modules/vitest/vitest.mjs run \
            --no-file-parallelism \
            --hookTimeout=60000 \
            --reporter=json \
            --outputFile=full-test-results.json
          node --input-type=module -e "import result from './full-test-results.json' with { type: 'json' }; const summary = { total: result.numTotalTests, passed: result.numPassedTests, failed: result.numFailedTests, skipped: result.numPendingTests }; console.log('Full test summary:', JSON.stringify(summary)); if (summary.failed !== 0 || summary.skipped !== 0) { throw new Error('The complete suite must have no failures or skips: ' + JSON.stringify(summary)); }"

      - name: Verify modality PostgreSQL tests executed
        run: |
          node node_modules/vitest/vitest.mjs run \
            src/domain/modality-database.test.ts \
            src/domain/modality-presentation-database.test.ts \
            --reporter=json \
            --outputFile=modality-postgres-results.json
          node --input-type=module -e "import result from './modality-postgres-results.json' with { type: 'json' }; if (result.numPassedTests !== 35 || result.numFailedTests !== 0 || result.numPendingTests !== 0) { throw new Error('Expected 35 passed modality PostgreSQL tests with no failures or skips. Received: ' + JSON.stringify({ passed: result.numPassedTests, failed: result.numFailedTests, skipped: result.numPendingTests })); }"

      - name: Verify financial PostgreSQL tests executed
        run: |
          node node_modules/vitest/vitest.mjs run \
            src/domain/financial-database.test.ts \
            --reporter=json \
            --outputFile=financial-postgres-results.json
          node --input-type=module -e "import result from './financial-postgres-results.json' with { type: 'json' }; if (result.numPassedTests !== 10 || result.numFailedTests !== 0 || result.numPendingTests !== 0) { throw new Error('Expected 10 passed financial PostgreSQL tests with no failures or skips. Received: ' + JSON.stringify({ passed: result.numPassedTests, failed: result.numFailedTests, skipped: result.numPendingTests })); }"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Validate diff whitespace
        run: git diff --check HEAD^..HEAD
